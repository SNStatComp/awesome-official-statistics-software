name: update

# Controls when the workflow will run
on:
  schedule:
  # run at 5 am 2nd day of week:
  - cron:  '0 5 * * 2'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      item_name:
        description: Process only this item from the software list
        required: false
        type: string
      max:
        description: Process at most N items
        required: false
        type: number
      item_type:
        description: Process only items of this type
        required: false
        type: choice
        options:
          - GH
          - CRAN
          - PYPI
          - GL
      force:
        description: Ignore cached metadata and refresh selected items
        required: false
        default: false
        type: boolean
      md:
        description: Only generate markdown output (step 5)
        required: false
        default: false
        type: boolean
      mdGH:
        description: Like md, but use GitHub badge URLs
        required: false
        default: false
        type: boolean

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./js

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        
      # setup node
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install


      - name: update
        run: |
          args=()
          if [[ -n "$ITEM_NAME" ]]; then
            args+=(--name "$ITEM_NAME")
          fi
          if [[ -n "$MAX" ]]; then
            args+=(--max "$MAX")
          fi
          if [[ -n "$ITEM_TYPE" ]]; then
            args+=(--type "$ITEM_TYPE")
          fi
          if [[ "$FORCE_METADATA" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "$MD_ONLY" == "true" ]]; then
            args+=(--md)
          fi
          if [[ "$MD_GH" == "true" ]]; then
            args+=(--mdGH)
          fi
          node update.js "${args[@]}"
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          ITEM_NAME: ${{ github.event.inputs.item_name }}
          MAX: ${{ github.event.inputs.max }}
          ITEM_TYPE: ${{ github.event.inputs.item_type }}
          FORCE_METADATA: ${{ github.event.inputs.force }}
          MD_ONLY: ${{ github.event.inputs.md }}
          MD_GH: ${{ github.event.inputs.mdGH }}
 
        

      # Commit files:
      - name: Commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ../metadata/
          git commit -a -m "Add changes" --allow-empty
        
      # push changes:
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
