name: Update

# Controls when the workflow will run
on:
  schedule:
  # run at 5 am 2nd day of week:
  - cron:  '0 5 * * 2'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      item_name:
        description: Process only this item from the software list
        required: false
        type: string
      force:
        description: Ignore cached metadata and refresh selected items
        required: false
        default: false
        type: boolean

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./js

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        
      # setup node
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install

      # retrieve pkg metadata
      - name: get_metadata
        run: |
          args=()
          if [[ -n "$ITEM_NAME" ]]; then
            args+=(--name "$ITEM_NAME")
          fi
          if [[ "$FORCE_METADATA" == "true" ]]; then
            args+=(--force)
          fi
          node get_metadata.js "${args[@]}"
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          ITEM_NAME: ${{ github.event.inputs.item_name }}
          FORCE_METADATA: ${{ github.event.inputs.force }}

      # aggregate metadata
      - name: aggregate_metadata
        run: node aggregate_metadata.js

      # generate readme
      - name: generate_readme_csv
        run: node generate_readme_csv.js
        
      # Commit files:
      - name: Commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ../metadata/
          git commit -a -m "Add changes" --allow-empty
        
      # push changes:
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
